<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สวนทานตะวันแห่งใจ 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sriracha&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#ffc93c; --leaf:#6fb866; --soil:#8a5a3a; --sky:#eafff0; --text:#4a3c1d; --gold:#ffb703;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(160deg,#fffbe8 0%, #eaffe8 50%, #d9f7d0 100%);
    font-family:'Noto Sans Thai Looped', sans-serif;
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    overflow-x:hidden;
  }
  h1,h2,.title{font-family:'Sriracha', cursive;}
  #app{
    width:100%; max-width:480px;
    background:rgba(255,255,255,0.78);
    border-radius:28px;
    box-shadow:0 18px 40px rgba(120,140,60,0.18);
    padding:28px 22px 30px;
    backdrop-filter:blur(6px);
    position:relative;
    min-height:420px;
    display:flex; flex-direction:column;
  }
  .title{font-size:1.5rem; color:#e08900; margin:0 0 6px; text-align:center;}
  .sub{text-align:center; font-size:0.95rem; opacity:0.85; margin:0 0 18px;}
  .center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;}
  .btn{
    border:none; border-radius:999px; padding:13px 28px; font-size:1rem;
    font-family:'Noto Sans Thai Looped', sans-serif; font-weight:700; cursor:pointer;
    background:linear-gradient(135deg,var(--gold),var(--sun));
    color:#4a3c1d; box-shadow:0 8px 18px rgba(255,183,3,0.35);
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(0.95);}
  .btn.ghost{background:#fff; color:#e08900; border:2px solid var(--gold); box-shadow:none;}
  .flower-stage{font-size:4.5rem; transition:transform .3s ease; filter:drop-shadow(0 6px 10px rgba(0,0,0,0.12));}
  .counter{font-weight:700; color:#e08900; font-size:1.1rem;}
  .can{font-size:3rem; cursor:pointer; user-select:none;}
  .hunt-box{
    position:relative; width:100%; max-width:320px; height:300px;
    background:#fdfbf0;
    border-radius:20px; margin:0 auto; overflow:hidden; border:2px solid #e3eed0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.5);
  }
  .hunt-item{
    position:absolute; font-size:1.8rem; cursor:pointer; user-select:none;
    animation:wig var(--d,2.4s) ease-in-out var(--delay,0s) infinite;
    transform:translate(-50%,-50%);
  }
  @keyframes wig{0%,100%{opacity:0.8;} 50%{opacity:1;}}
  .hunt-item.found{animation:none; opacity:0 !important; pointer-events:none; transition:opacity .3s;}
  .bar-wrap{width:100%; max-width:300px; margin:10px auto;}
  .bar-bg{width:100%; height:18px; border-radius:999px; background:#eafbe0; overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--leaf),var(--sun)); width:0%; transition:width .5s ease;}
  .quiz-q{font-size:1.05rem; font-weight:700; margin-bottom:12px;}
  .opt-row{display:flex; flex-direction:column; gap:10px; width:100%;}
  .opt{
    border:2px solid var(--gold); background:#fff; border-radius:14px; padding:11px 14px;
    font-family:'Noto Sans Thai Looped',sans-serif; font-size:0.95rem; cursor:pointer; text-align:left;
  }
  .opt:active{background:var(--sun); color:#fff;}
  input[type=range]{width:100%; max-width:300px;}
  .score-msg{min-height:44px; font-weight:700; color:#e08900;}
  canvas#scratch{border-radius:16px; touch-action:none;}
  .scratch-wrap{position:relative; width:280px; height:160px; margin:0 auto;}
  .scratch-under{
    position:absolute; inset:0; border-radius:16px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#fffbe8,#eaffe0); font-weight:700; padding:14px; text-align:center; font-size:0.95rem;
  }
  .dodge-wrap{position:relative; height:70px;}
  .finale-row{display:flex; gap:14px; justify-content:center; margin-top:10px;}
  .hide{display:none !important;}
  @media (max-width:420px){ #app{padding:22px 16px 26px;} .hunt-box{height:270px;} }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:0.01ms !important;} }
  .float-petal{position:fixed; pointer-events:none; font-size:1.6rem; z-index:999;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(74,60,29,0.45); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal-box{
    background:#fffbe8; border-radius:20px; padding:22px 20px; max-width:320px; text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.25); animation:popIn .25s ease;
  }
  @keyframes popIn{from{transform:scale(0.7); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal-emoji{font-size:2.4rem; margin-bottom:8px;}
  .modal-text{font-weight:700; color:#4a3c1d; font-size:1rem; margin:0 0 16px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  const state = { step:0, waters:0, needWaters:5, foundBees:0, needBees:6, bright:0, qidx:0, score:50 };
  const GROW_STAGES = ['🌱','🌿','🌻'];

  function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

  function petalBurst(x,y){
    for(let i=0;i<10;i++){
      const h = document.createElement('div');
      h.className='float-petal';
      h.textContent = ['🌻','✨','🐝','💛'][Math.floor(Math.random()*4)];
      h.style.left = x+'px'; h.style.top = y+'px';
      document.body.appendChild(h);
      const dx = (Math.random()-0.5)*160, dy = -(80+Math.random()*120);
      h.animate([
        {transform:'translate(0,0) scale(0.6)', opacity:1},
        {transform:`translate(${dx}px,${dy}px) scale(1.1)`, opacity:0}
      ], {duration: 900+Math.random()*500, easing:'ease-out'});
      setTimeout(()=>h.remove(), 1500);
    }
  }

  function confettiBurst(){
    for(let i=0;i<40;i++){
      const c = document.createElement('div');
      c.className='float-petal';
      c.textContent = ['🌻','🎉','💛','🐝','🌼'][Math.floor(Math.random()*5)];
      c.style.left = (window.innerWidth/2)+'px';
      c.style.top = '-20px';
      document.body.appendChild(c);
      const dx = (Math.random()-0.5)*window.innerWidth*0.8;
      const dur = 2000+Math.random()*1200;
      c.animate([
        {transform:'translate(0,0) rotate(0deg)', opacity:1},
        {transform:`translate(${dx}px, ${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`, opacity:0.9}
      ], {duration:dur, easing:'ease-in'});
      setTimeout(()=>c.remove(), dur+100);
    }
  }

  function showModal(emoji, text, onClose){
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal-box"><div class="modal-emoji">${emoji}</div><p class="modal-text">${text}</p><button class="btn" id="modalCloseBtn">โอเค 💛</button></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#modalCloseBtn').onclick = ()=>{ ov.remove(); if(onClose) onClose(); };
  }

  function render(){
    app.innerHTML = '';
    const fn = STEPS[state.step];
    fn();
  }

  function renderIntro(){
    app.appendChild(el(`
      <div class="center">
        <div class="flower-stage">🌱</div>
        <h1 class="title">สวนทานตะวันแห่งใจ</h1>
        <p class="sub">มีเมล็ดพันธุ์เล็กๆ อยากปลูกให้ฮายคนเดียวครับ 😳</p>
        <button class="btn" id="startBtn">เริ่มปลูกกันเลย 🌻</button>
      </div>
    `));
    document.getElementById('startBtn').onclick = ()=>{ state.step=1; render(); };
  }

  function renderGrow(){
    const wrap = el(`
      <div class="center">
        <h2 class="title" style="font-size:1.2rem;">ช่วยผมรดน้ำให้ทานตะวันโตหน่อยครับ 💧</h2>
        <p class="sub">กดรดน้ำให้ครบนะครับ <span class="counter">${state.needWaters}</span> ครั้งนะ</p>
        <div class="flower-stage" id="flower">🌱</div>
        <div class="counter" id="cnt">0 / ${state.needWaters}</div>
        <div class="can" id="canBtn">💧</div>
      </div>
    `);
    app.appendChild(wrap);
    const flower = wrap.querySelector('#flower');
    const cnt = wrap.querySelector('#cnt');
    const can = wrap.querySelector('#canBtn');
    can.onclick = (ev)=>{
      if(state.waters >= state.needWaters) return;
      state.waters++;
      cnt.textContent = `${state.waters} / ${state.needWaters}`;
      const stageIdx = Math.min(GROW_STAGES.length-1, Math.floor((state.waters/state.needWaters) * GROW_STAGES.length));
      flower.textContent = GROW_STAGES[stageIdx];
      flower.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration:300});
      const r = can.getBoundingClientRect();
      petalBurst(r.left+r.width/2, r.top);
      if(state.waters >= state.needWaters){
        flower.textContent = '🌻';
        setTimeout(()=>{
          app.appendChild(el(`<div class="center" style="margin-top:14px;"><p class="sub" style="font-weight:700;color:#e08900">เติบโตแบบสวยสดใสเลย! 🌻✨</p><button class="btn" id="nextBtn">ต่อไป</button></div>`));
          document.getElementById('nextBtn').onclick = ()=>{ state.step=2; render(); };
        }, 400);
      }
    };
  }

  function scatterPoints(n, minDist){
    const pts = [];
    let tries=0;
    while(pts.length < n && tries < 4000){
      tries++;
      const p = { x: 10+Math.random()*80, y: 10+Math.random()*80 };
      if(pts.every(q => Math.hypot(p.x-q.x, p.y-q.y) > minDist)) pts.push(p);
    }
    while(pts.length < n) pts.push({x:10+Math.random()*80, y:10+Math.random()*80});
    return pts;
  }

  const BEE_MESSAGES = [
    'ผึ้งตัวนี้บอกว่าคุณน่ารักที่สุดในสวนนี้ 🐝💛',
    'ผึ้งตัวนี้บอกว่าผมคิดถึงฮายมากๆ 😳🌻',
    'ตาไวขนาดนี้ มองเห็นผมในสายตาแล้วไหมนะครับ 👀✨',
    'ผึ้งตัวนี้ฝากบอกว่า สวนนี้ปลูกไว้เพื่อคุณคนเดียว 😳🌼',
    'เจอแล้ว! ใกล้ครบแล้วนะครับ อดทนอีกนิดนะครับอ้วง 💪',
    'ตัวสุดท้ายแล้ว! ผึ้งบอกว่าผมชอบอ้วงมากนะครับ 🐝💌'
  ];

  function renderHunt(){
    const wrap = el(`
      <div class="center">
        <h2 class="title" style="font-size:1.2rem;">ตามหาผึ้งน้อย 🐝</h2>
        <p class="sub">ผึ้งตัวจริงซ่อนอยู่ท่ามกลางแมลงหน้าตาคล้ายกัน หาให้ครบนะครับเบบี๋ 😳<b>${state.needBees}</b> ตัวนะ</p>
        <div class="hunt-box" id="hbox"></div>
        <div class="counter" id="tcnt">พบแล้ว 0 / ${state.needBees}</div>
      </div>
    `);
    app.appendChild(wrap);
    const box = wrap.querySelector('#hbox');
    const tcnt = wrap.querySelector('#tcnt');
    const realN = state.needBees;
    // keep the decoy set small and visually close to a bee so the page stays clean, not noisy
    const decoyEmojis = ['🐞','🦋','🟡'];
    const decoyN = 14;
    const minDist = 13;
    const totalPts = scatterPoints(realN + decoyN, minDist);
    let foundCount = 0;
    const realIdx = new Set();
    while(realIdx.size < realN){ realIdx.add(Math.floor(Math.random()*totalPts.length)); }

    totalPts.forEach((p, i)=>{
      const isReal = realIdx.has(i);
      const item = document.createElement('div');
      item.className = 'hunt-item';
      item.textContent = isReal ? '🐝' : decoyEmojis[Math.floor(Math.random()*decoyEmojis.length)];
      item.style.left = p.x+'%';
      item.style.top = p.y+'%';
      // slight, tidy size/rotation variance so real bees don't stand out, without looking chaotic
      const scale = (0.92 + Math.random()*0.16).toFixed(2);
      const rot = Math.floor(Math.random()*16 - 8);
      item.style.transform = `translate(-50%,-50%) scale(${scale}) rotate(${rot}deg)`;
      item.style.setProperty('--d', (1.3 + Math.random()*2.0).toFixed(2)+'s');
      item.style.setProperty('--delay', (Math.random()*3).toFixed(2)+'s');
      item.onclick = (ev)=>{
        if(isReal){
          if(item.classList.contains('found')) return;
          item.classList.add('found');
          foundCount++;
          tcnt.textContent = `พบแล้ว ${foundCount} / ${state.needBees}`;
          const r = item.getBoundingClientRect();
          petalBurst(r.left, r.top);
          const msg = BEE_MESSAGES[(foundCount-1) % BEE_MESSAGES.length];
          setTimeout(()=>{
            showModal('🐝', msg, ()=>{
              if(foundCount >= realN){
                app.appendChild(el(`<div class="center" style="margin-top:12px;"><p class="sub" style="font-weight:700;color:#e08900">เจอครบแล้ว! เก่งมากกกครับเบบี๋ของผม 🐝🎉</p><button class="btn" id="nextBtn2">ต่อไป</button></div>`));
                document.getElementById('nextBtn2').onclick = ()=>{ state.step=3; render(); };
              }
            });
          }, 250);
        } else {
          item.animate([{transform:'translate(-50%,-50%) rotate(0deg)'},{transform:'translate(-55%,-45%) rotate(-8deg)'},{transform:'translate(-45%,-55%) rotate(8deg)'},{transform:'translate(-50%,-50%) rotate(0deg)'}], {duration:300});
        }
      };
      box.appendChild(item);
    });
  }

  const QUIZ = [
    { q:'ทานตะวันหันตามแสงอาทิตย์เสมอ แล้วคุณล่ะ หันตามใครบ่อยที่สุด?', opts:[
      {t:'หันตามคนที่ทำให้วันธรรมดาสดใสขึ้น', v:35},
      {t:'หันตามความรู้สึกของตัวเองก่อน', v:20}
    ]},
    { q:'ถ้าสวนแห่งนี้แทนใจผม คุณอยากเดินเข้ามาชมดูไหม?', opts:[
      {t:'เดินมาดูใกล้ๆได้เลยครับ 😳', v:35},
      {t:'อย่าไปอยากดูจากที่ไกลๆเลยครับฮาย', v:15}
    ]},
    { q:'ทานตะวันดอกนี้ปลูกไว้เพื่อใคร รู้ไหมครับ?', opts:[
      {t:'เพื่อคนที่อ่านข้อความนี้อยู่นี่แหละ 😳', v:35},
      {t:'เพื่ออ้วงของผมไงครับ 😳', v:30}
    ]}
  ];

  function renderQuiz(){
    const q = QUIZ[state.qidx];
    const wrap = el(`
      <div class="center">
        <h2 class="title" style="font-size:1.2rem;">เช็กความสดใสของสวน ☀️</h2>
        <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" id="bar" style="width:${state.bright}%;"></div></div></div>
        <p class="quiz-q">${q.q}</p>
        <div class="opt-row" id="opts"></div>
      </div>
    `);
    app.appendChild(wrap);
    const optsWrap = wrap.querySelector('#opts');
    q.opts.forEach(o=>{
      const b = document.createElement('button');
      b.className='opt';
      b.textContent = o.t;
      b.onclick = ()=>{
        state.bright = Math.min(100, state.bright + o.v);
        state.qidx++;
        if(state.qidx < QUIZ.length){ render(); }
        else {
          app.innerHTML='';
          app.appendChild(el(`
            <div class="center">
              <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" id="barF" style="width:${state.bright}%;"></div></div></div>
              <p class="sub" style="font-weight:700;color:#e08900">สวนสดใสเต็มที่แล้ว! ☀️🌻</p>
              <button class="btn" id="nextBtn3">ต่อไป</button>
            </div>
          `));
          document.getElementById('nextBtn3').onclick = ()=>{ state.step=4; render(); };
        }
      };
      optsWrap.appendChild(b);
    });
  }

  function renderScore(){
    const wrap = el(`
      <div class="center">
        <h2 class="title" style="font-size:1.2rem;">วัดความสวยงามในสวนของเราตอนนี้</h2>
        <div class="flower-stage" id="face" style="font-size:2.4rem;">🌻</div>
        <input type="range" min="0" max="100" value="50" id="slider">
        <p class="score-msg" id="msg">บานอยู่พอดี ๆ</p>
        <button class="btn" id="nextBtn4">ต่อไป</button>
      </div>
    `);
    app.appendChild(wrap);
    const slider = wrap.querySelector('#slider');
    const msg = wrap.querySelector('#msg');
    const face = wrap.querySelector('#face');
    function upd(v){
      v = Number(v);
      if(v===0){ msg.textContent='ยังเป็นต้นเล็กๆอยู่เลยนะครับ 😢'; face.textContent='🌱'; }
      else if(v===100){ msg.textContent='ดอกไม้ในสวนออกดอกเต็มที่แล้ว เราอยู่ด้วยกันไปนานๆนะครับ 😳'; face.textContent='🌻'; }
      else if(v<40){ msg.textContent='เริ่มแตกใบแล้วนะครับเนี่ย'; face.textContent='🌿'; }
      else if(v<75){ msg.textContent='ค่อยๆเติบโตขึ้นเรื่อยๆ เหมือนความสัมพันธ์ของเราสองคนเลยครับ 😳'; face.textContent='🌼'; }
      else { msg.textContent='ความสัมพันธ์ของเราเริ่มเติบโตแล้วนะครับ 🌻💛'; face.textContent='🌻'; }
      state.score = v;
    }
    slider.oninput = (e)=>upd(e.target.value);
    upd(50);
    wrap.querySelector('#nextBtn4').onclick = ()=>{ state.step=5; render(); };
  }

  function setupScratch(canvas, under, onDone, threshold){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('ขูดตรงนี้ดูสิ 👆', w/2, h/2);
    ctx.globalCompositeOperation = 'destination-out';
    let drawing=false, done=false;
    function pos(ev){
      const r = canvas.getBoundingClientRect();
      const cx = (ev.touches? ev.touches[0].clientX : ev.clientX) - r.left;
      const cy = (ev.touches? ev.touches[0].clientY : ev.clientY) - r.top;
      return {x: cx*(canvas.width/r.width), y: cy*(canvas.height/r.height)};
    }
    function stroke(ev){
      const p = pos(ev);
      ctx.strokeStyle = '#000'; // must be opaque, otherwise destination-out only erases partially
      ctx.lineWidth = 28; ctx.lineCap='round'; ctx.lineJoin='round';
      ctx.beginPath();
      if(canvas._last){ ctx.moveTo(canvas._last.x, canvas._last.y); } else { ctx.moveTo(p.x,p.y); }
      ctx.lineTo(p.x,p.y); ctx.stroke();
      canvas._last = p;
      checkPct();
    }
    function checkPct(){
      if(done) return;
      const data = ctx.getImageData(0,0,w,h).data;
      let clear=0;
      for(let i=3;i<data.length;i+=4*17){ if(data[i]===0) clear++; }
      const pct = clear / (data.length/(4*17));
      if(pct >= threshold){ done=true; under.style.zIndex=5; canvas.style.opacity='0'; onDone(); }
    }
    function start(ev){ drawing=true; stroke(ev); }
    function move(ev){ if(drawing) stroke(ev); }
    function end(){ drawing=false; canvas._last=null; }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', (e)=>{start(e); e.preventDefault();}, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{move(e); e.preventDefault();}, {passive:false});
    canvas.addEventListener('touchend', end);
  }

  function renderFinal(){
    const wrap = el(`
      <div class="center">

  function makeDodger(btn){
    const taunts = ['ไม่เอานะ 😤','จับผมไม่ได้หรอก','เปลี่ยนใจเถอะน่า 🥺','กดอันข้าง ๆ ดีกว่า 😏','ฮ่า ๆ ไม่ทันหรอก', 'ไม่', 'ไม่จริงอ่ะ', 'ผมไม่เชื่อ', 'จะทำอะไรอ่ะ', 'บอกแล้วว่าเร็วกว่าจริงๆ', 'ลองอีกทีสิ', 'ยังไม่ยอมแพ้อีกหรอ', 'ยอมเถอะ', 'ยอมเถอะนะครับ', 'น่านะ', 'นะครับๆๆๆ', 'ยอมละหรอ', 'เก่งมากครับ', 'ยอมก็ดีครับ', 'ยอมเป็นคนของผมละกัน 🤭'];
    let ti = 0;
    function teleport(){
      const w = btn.offsetWidth, h = btn.offsetHeight;
      const maxX = window.innerWidth - w - 20;
      const maxY = window.innerHeight - h - 20;
      const x = 10 + Math.random()*Math.max(10,maxX-10);
      const y = 10 + Math.random()*Math.max(10,maxY-10);
      btn.style.position='fixed';
      btn.style.left = x+'px';
      btn.style.top = y+'px';
      btn.textContent = taunts[ti % taunts.length];
      ti++;
    }
    btn.addEventListener('mouseenter', teleport);
    btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); teleport(); }, {passive:false});
    btn.addEventListener('click', (e)=>{ e.preventDefault(); teleport(); });
  }
